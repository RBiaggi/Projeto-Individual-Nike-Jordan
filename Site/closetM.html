<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="closet.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300..700&display=swap">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div id="coluna" class="coluna">
        <div class="frame">
            <nav>
                <div class="img-nav">
                    <img style="display: inline; width: 110px;" src="assets/001_nike-logos-swoosh-black.png" alt="logo-nike">
                    <img style="display: inline; width: 70px;" src="assets/icon-closet.webp" alt="icon-closet" onclick="window.location.href='closet.html'">
                </div>
                <h2 style="margin-right: 100px; cursor: pointer;" onclick="window.location.href='login.html'">Login</h2>
            </nav>
            <div style="display: flex;">
                <button id="botao_voltar" onclick="window.location.href='escolhaGenero.html'">↩</button>
                <p id="titulo">DEFINA SEU LOOK</p>
            </div>
            <div class="display">
                <div class="card">
                    <p>Cabeça</p>
                    <div class="carrossel">
                        <button onclick="voltar1()">❮</button>
                        <div class="janela">
                            <div class="faixa" id="faixa1">
                                <img src="assets/look-masculino/cabeca/bone.webp" alt="Foto 4">
                                <img src="assets/look-masculino/cabeca/chapeu.jpg" alt="Foto 1">
                                <img src="assets/look-masculino/cabeca/faixa.jpg" alt="Foto 2">
                                <img src="assets/look-masculino/cabeca/touca.jpg" alt="Foto 3">
                                <img style="padding: 20px;" src="assets/look-masculino/cabeca/nenhum.png" alt="Foto 5">
                            </div>
                        </div>
                        <button onclick="avancar1()">❯</button>
                    </div>
                </div>
                <div class="card">
                    <p>Tronco</p>
                    <div class="carrossel">
                        <button onclick="voltar2()">❮</button>
                        <div class="janela">
                            <div class="faixa" id="faixa2">
                                <img src="assets/look-masculino/tronco/camisaP.jpg" alt="Foto 1">
                                <img src="assets/look-masculino/tronco/blusa.webp" alt="Foto 2">
                                <img src="assets/look-masculino/tronco/camisaB.jpg" alt="Foto 3">
                                <img src="assets/look-masculino/tronco/dri-fit.avif" alt="Foto 4">
                                <img src="assets/look-masculino/tronco/compress.jpg" alt="Foto 5">
                                <img src="assets/look-masculino/tronco/jersey.jpg" alt="Foto 6">
                            </div>
                        </div>
                        <button onclick="avancar2()">❯</button>
                    </div>
                </div>
                <div class="card">
                    <p>Pernas</p>
                    <div class="carrossel">
                        <button onclick="voltar3()">❮</button>
                        <div class="janela">
                            <div class="faixa" id="faixa3">
                                <img src="assets/look-masculino/pernas/essentials.jpg" alt="Foto 1">
                                <img src="assets/look-masculino/pernas/oversize.avif" alt="Foto 2">
                                <img src="assets/look-masculino/pernas/woven.avif" alt="Foto 3">
                                <img src="assets/look-masculino/pernas/diamond.jpg" alt="Foto 4">
                                <img src="assets/look-masculino/pernas/shorts.webp" alt="Foto 5">
                            </div>
                        </div>
                        <button onclick="avancar3()">❯</button>
                    </div>
                </div>
                <div class="card">
                    <p>Pés</p>
                    <div class="carrossel">
                        <button onclick="voltar4()">❮</button>
                        <div class="janela">
                            <div class="faixa" id="faixa4">
                                <img src="assets/look-masculino/pes/aj1.jpg" alt="Foto 1">
                                <img src="assets/look-masculino/pes/aj13.webp" alt="Foto 2">
                                <img src="assets/look-masculino/pes/aj4.jpg" alt="Foto 3">
                                <img src="assets/look-masculino/pes/aj11.webp" alt="Foto 4">
                                <img src="assets/look-masculino/pes/slide.avif" alt="Foto 5">
                                <img src="assets/look-masculino/pes/tn.avif" alt="Foto 6">
                            </div>
                        </div>
                        <button onclick="avancar4()">❯</button>
                    </div>
                </div>
            </div>
            <button id="concluir" onclick="concluir()">Concluir</button>
        </div>
        <div id="borda">
            <div class="display2">
                <button onclick="voltarCloset()">⬆</button>
                <p id="titulo_geral">Suas Estatísticas</p>
                <div class="dashboard">
                    <div class="dash-texto">
                        <p id="titulo_dash"></p>
                        <p id="texto_dash"></p>
                    </div>
                    <div class="dash-chart">
                        <div class="kpi-row">
                            <div class="kpi" id="kpi1">
                                <p class="kpi-titulo">TENTATIVA</p>
                                <p class="kpi-valor" id="kpi1-valor">#1</p>
                            </div>
                            <div class="kpi" id="kpi2">
                                <p class="kpi-titulo">NOTA</p>
                                <p class="kpi-valor" id="kpi2-valor">8.5</p>
                            </div>
                            <div class="kpi" id="kpi3">
                                <p class="kpi-titulo">IDADE ESTÉTICA</p>
                                <p class="kpi-valor" id="kpi3-valor">22 ANOS</p>
                            </div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 20px; padding-top: 20px;">
                            <div style="width: 400px; height: 400px;">
                                <canvas id="grafico-linha"></canvas>
                            </div>
                            <div style="width: 400px; height: 400px;">
                                <canvas id="grafico-rosca"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
<script>
    let posicao1 = 0;
    let posicao2 = 0;
    let posicao3 = 0;
    let posicao4 = 0;

    let streetware = 0;
    let casual = 0;
    let social = 0;
    let esportivo = 0;

    function avancar1() {
        if (posicao1 > -1200) {
            posicao1 = posicao1 - 300;
            faixa1.style.transform = `translateX(${posicao1}px)`;
        }
    }

    function voltar1() {
        if (posicao1 < 0) {
            posicao1 = posicao1 + 300;
            faixa1.style.transform = `translateX(${posicao1}px)`;
        }
    }

    function avancar2() {
        if (posicao2 > -1500) {
            posicao2 = posicao2 - 300;
            faixa2.style.transform = `translateX(${posicao2}px)`;
        }
    }

    function voltar2() {
        if (posicao2 < 0) {
            posicao2 = posicao2 + 300;
            faixa2.style.transform = `translateX(${posicao2}px)`;
        }
    }

    function avancar3() {
        if (posicao3 > -1200) {
            posicao3 = posicao3 - 300;
            faixa3.style.transform = `translateX(${posicao3}px)`;
        }
    }

    function voltar3() {
        if (posicao3 < 0) {
            posicao3 = posicao3 + 300;
            faixa3.style.transform = `translateX(${posicao3}px)`;
        }
    }

    function avancar4() {
        if (posicao4 > -1500) {
            posicao4 = posicao4 - 300;
            faixa4.style.transform = `translateX(${posicao4}px)`;
        }
    }

    function voltar4() {
        if (posicao4 < 0) {
            posicao4 = posicao4 + 300;
            faixa4.style.transform = `translateX(${posicao4}px)`;
        }
    }

    function concluir() {

        streetware = 0;
        casual = 0;
        social = 0;
        esportivo = 0;

        coluna.style.transform = `translatey(${-100}vh)`;

        if(posicao1 == 0){
            streetware += 40; casual += 35; social += 15; esportivo += 10;
        } else if(posicao1 == -300){
            streetware += 55; casual += 25; social += 5; esportivo += 15;
        } else if (posicao1 == -600){
            streetware += 10; casual += 10; social += 0; esportivo += 80;
        } else if (posicao1 == -900){
            streetware += 50; casual += 30; social += 5; esportivo += 15;
        }

        if(posicao2 == 0){
            streetware += 65; casual += 15; social += 15; esportivo += 5;
        } else if(posicao2 == -300){
            streetware += 30; casual += 45; social += 20; esportivo += 5;
        } else if (posicao2 == -600){
            streetware += 5; casual += 5; social += 0; esportivo += 90;
        } else if (posicao2 == -900){
            streetware += 60; casual += 20; social += 5; esportivo += 15;
        } else if (posicao2 == -1200){
            streetware += 20; casual += 20; social += 5; esportivo += 55;
        } else if (posicao2 == -1500){
            streetware += 60; casual += 15; social += 5; esportivo += 20;
        }

        if(posicao3 == 0){
            streetware += 45; casual += 15; social += 0; esportivo += 40;
        } else if(posicao3 == -300){
            streetware += 35; casual += 45; social += 10; esportivo += 10;
        } else if (posicao3 == -600){
            streetware += 15; casual += 15; social += 0; esportivo += 70;
        } else if (posicao3 == -900){
            streetware += 65; casual += 20; social += 5; esportivo += 10;
        } else if (posicao3 == -1200){
            streetware += 55; casual += 25; social += 5; esportivo += 15;
        } else if (posicao3 == -1500){
            streetware += 30; casual += 35; social += 15; esportivo += 20;
        }

        if(posicao4 == 0){
            streetware += 65; casual += 15; social += 15; esportivo += 5;
        } else if(posicao4 == -300){
            streetware += 50; casual += 20; social += 25; esportivo += 5;
        } else if (posicao4 == -600){
            streetware += 60; casual += 20; social += 10; esportivo += 10;
        } else if (posicao4 == -900){
            streetware += 10; casual += 50; social += 5; esportivo += 35;
        } else if (posicao4 == -1200){
            streetware += 50; casual += 20; social += 5; esportivo += 25;
        } else if (posicao4 == -1500){
            streetware += 70; casual += 15; social += 10; esportivo += 5;
        }

        let totalPontos = streetware + casual + social + esportivo;
        let estiloVencedor = '';
        let textoDashboard = '';
        let pontuacaoVencedor = 0;
        let nota = 0

        if (streetware >= casual && streetware >= social && streetware >= esportivo) {
            estiloVencedor = 'StreetWare';
            textoDashboard = 'Seu estilo é urbano e autêntico. Você se inspira na cultura das ruas, no skate e no basquete. Confiante e despojado, você usa a moda como forma de expressão.';
            pontuacaoVencedor = streetware
        } else if (casual >= streetware && casual >= social && casual >= esportivo) {
            estiloVencedor = 'Casual';
            textoDashboard = 'Seu estilo é confortável e versátil. Você prioriza praticidade sem abrir mão do visual. Equilibrado e acessível, seu look funciona em qualquer situação.';
            pontuacaoVencedor = casual
        } else if (social >= casual && social >= streetware && social >= esportivo) {
            estiloVencedor = 'Social';
            textoDashboard = 'Seu estilo é refinado e elegante. Você se preocupa com a impressão que causa e se veste para ocasiões. Cuidadoso e sofisticado, cada detalhe importa.';
            pontuacaoVencedor = social
        } else if (esportivo >= casual && esportivo >= social && esportivo >= streetware) {
            estiloVencedor = 'Esportivo';
            textoDashboard = 'Seu estilo é dinâmico e funcional. Você vive em movimento e suas roupas acompanham seu ritmo. Focado e energético, performance e estilo andam juntos.';
            pontuacaoVencedor = esportivo
        }

        nota = ((pontuacaoVencedor / totalPontos) * 10).toFixed(1);

        console.log(nota)

        titulo_dash.innerHTML = estiloVencedor;
        texto_dash.innerHTML = textoDashboard;

        const ctx2 = document.getElementById('grafico-linha');
        new Chart(ctx2, {
            type: 'line',
            data: {
                labels: ['#1', '#2', '#3', '#4', '#5'],
                datasets: [{
                    label: 'Nota por tentativa',
                    data: [2, 5, 8, 10, 8.5],
                    borderColor: '#C8102E',
                    backgroundColor: 'rgba(200, 16, 46, 0.1)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                maintainAspectRatio: false
            }
        });

        const ctx = document.getElementById('grafico-rosca');
        new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['StreetWare', 'Casual', 'Social', 'Esportivo'],
                datasets: [{
                    data: [streetware, casual, social, esportivo],
                    backgroundColor: ['#C8102E', '#1a1a1a', '#555', '#bbb']
                }]
            },
            options: {
                maintainAspectRatio: false
            }
        });
    }

    function voltarCloset() {
        coluna.style.transform = `translatey(${0}vh)`;
    }
</script>
