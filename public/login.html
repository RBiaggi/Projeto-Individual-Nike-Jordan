<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Login</title>
</head>

<body>
    <nav>
        <div class="img-nav">
            <img style="display: inline; width: 110px;" src="assets/001_nike-logos-swoosh-black.png" alt="logo-nike" onclick="window.location.href='index.html'">
        </div>
        <h2 style="margin-right: 100px; cursor: pointer;" onclick="window.location.href='login.html'">Login</h2>
    </nav>
    <div class="signup-wrapper">
        <div class="formulario glass-card">
            <h1>Entrar</h1>

            <div class="campo">
                <label for="email_input_login">Email</label>
                <input type="email" id="email_input_login" required>
            </div>

            <div class="campo">
                <label for="senha_input_login">Senha</label>
                <input type="password" id="senha_input_login" required>
            </div>

            <div class="botao">
                <button type="button" onclick="entrar()">Entrar</button>
            </div>

            <span id="verificar_login" class="msg-erro"></span>

            <p class="rodape-form">
                Não tem conta?
                <span class="link-acao" onclick="window.location.href='cadastro.html'">Criar conta</span>
            </p>
        </div>
    </div>


    <script>
    function entrar() {
        var email = document.getElementById("email_input_login").value.trim();
        var senha = document.getElementById("senha_input_login").value.trim();

        if (email == "" || senha == "") {
            document.getElementById("verificar_login").innerHTML = "Preencha todos os campos.";
            return;
        }

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                emailServer: email,
                senhaServer: senha
            })
        })
        .then(function(response) {
            if (response.ok) {
                return response.json();
            } else {
                document.getElementById("verificar_login").innerHTML = "Email e/ou senha inválidos.";
            }
        })
        .then(function(usuario) {
            if (usuario) {
                sessionStorage.setItem("usuarioLogado", JSON.stringify(usuario));
                window.location.href = "escolhaGenero.html";
            }
        })
        .catch(function(erro) {
            alert("Erro de conexão com o servidor.");
        });
    }
    </script>
    </body>

</html>
